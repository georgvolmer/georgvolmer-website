<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almost there — Georg Volmer</title>
    <meta name="description" content="Thanks for signing up — check your inbox to confirm.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="icon" type="image/png" href="/assets/Georg-Volmer-icon-RGB.png">
    <link rel="apple-touch-icon" href="/assets/Georg-Volmer-icon-RGB.png">
    <style>
        .confirm-wrap {
            text-align: center;
        }
        .confirm-portrait {
            display: block;
            width: 120px;
            height: 120px;
            margin: 0 auto 28px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 18px rgba(77, 77, 79, 0.18);
        }
        .confirm-wrap h1 {
            margin-bottom: 20px;
        }
        .confirm-wrap p {
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .confirm-note {
            margin-top: 24px;
            font-size: 0.875rem;
            color: #999999;
        }
        @media (max-width: 600px) {
            .confirm-portrait {
                width: 96px;
                height: 96px;
            }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="https://georgvolmer.com" class="site-logo" aria-label="Georg Volmer – Home">
            <img src="/assets/Georg-Volmer-logo-RGB.png" alt="Georg Volmer" height="38">
        </a>
    </div>
</header>

<main>
    <div class="container confirm-wrap">

        <img class="confirm-portrait" src="/img/portfolio/georg-volmer-check-inbox.jpg" alt="Portrait of Georg Volmer">

        <h1>Almost there.</h1>
        <p>Check your inbox and click the confirmation link. Everything opens right away.</p>
        <p class="confirm-note">Nothing yet? Check your spam folder.</p>

    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <ul class="footer-nav">
            <li><a href="/impressum">Impressum</a></li>
            <li><a href="/datenschutz">Datenschutz</a></li>
            <li><a href="/privacy">Privacy Policy</a></li>
        </ul>
        <p class="footer-copy">&copy; 2026 Georg Volmer</p>
    </div>
</footer>

</body>
</html>
